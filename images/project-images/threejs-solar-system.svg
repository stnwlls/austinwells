<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">Three.js Solar System project preview</title>
  <desc id="desc">A stylized solar system with glowing orbits and planets on a dark space background.</desc>
  <defs>
    <radialGradient id="background" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#17234b"/>
      <stop offset="50%" stop-color="#0d1025"/>
      <stop offset="100%" stop-color="#05060d"/>
    </radialGradient>
    <radialGradient id="sun" cx="38%" cy="34%" r="62%">
      <stop offset="0%" stop-color="#fff7a3"/>
      <stop offset="42%" stop-color="#ff9f1c"/>
      <stop offset="100%" stop-color="#d64000"/>
    </radialGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="1200" height="720" fill="url(#background)"/>
  <g fill="#ffffff" opacity="0.75">
    <circle cx="128" cy="95" r="2"/>
    <circle cx="250" cy="170" r="1.5"/>
    <circle cx="1050" cy="120" r="2"/>
    <circle cx="960" cy="620" r="1.5"/>
    <circle cx="430" cy="75" r="1.2"/>
    <circle cx="755" cy="90" r="1.8"/>
    <circle cx="1085" cy="390" r="1.4"/>
    <circle cx="160" cy="590" r="1.7"/>
    <circle cx="640" cy="650" r="1.3"/>
    <circle cx="860" cy="255" r="1.2"/>
  </g>
  <g transform="translate(188 360)">
    <circle r="72" fill="url(#sun)" filter="url(#glow)"/>
    <g fill="none" stroke="#8ab2d4" stroke-opacity="0.28">
      <ellipse rx="150" ry="54"/>
      <ellipse rx="230" ry="86"/>
      <ellipse rx="316" ry="122"/>
      <ellipse rx="430" ry="164"/>
      <ellipse rx="560" ry="214"/>
      <ellipse rx="720" ry="274"/>
      <ellipse rx="875" ry="332"/>
    </g>
    <circle cx="148" cy="-10" r="10" fill="#9ca6a8"/>
    <circle cx="220" cy="42" r="17" fill="#d7af62"/>
    <circle cx="306" cy="-46" r="22" fill="#2f78d6"/>
    <circle cx="420" cy="86" r="15" fill="#b64d32"/>
    <circle cx="545" cy="-120" r="48" fill="#d29b62"/>
    <g transform="translate(688 165) rotate(-14)">
      <circle r="42" fill="#d6bd89"/>
      <ellipse rx="82" ry="19" fill="none" stroke="#e4d2a6" stroke-width="7" stroke-opacity="0.9"/>
    </g>
    <circle cx="845" cy="-188" r="30" fill="#8ad2d4"/>
    <circle cx="1000" cy="248" r="29" fill="#4668d7"/>
    <circle cx="1095" cy="-268" r="7" fill="#c8d6df"/>
  </g>
  <text x="70" y="92" fill="#ffffff" font-family="Jura, Arial, sans-serif" font-size="52" font-weight="700">Three.js Solar System</text>
  <text x="72" y="136" fill="#8ab2d4" font-family="Jura, Arial, sans-serif" font-size="24">interactive WebGL planet scene</text>
</svg>
